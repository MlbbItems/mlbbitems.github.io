<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | MLBB Items</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    MLBB Items
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy policy</a>
    <a href="about.html">About</a>
  </nav>

  <main>
    <div class="card contact-card">
      <h2>📬 Contact Us</h2>
      <p class="subtitle">Have questions or feedback? Send us a message.</p>

      <form
        action="https://formspree.io/f/meorqglj"
        method="POST"
        class="contact-form"
      >
        <div class="input-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <label>Message</label>
          <textarea name="message" rows="5" placeholder="Write your message..." required></textarea>
        </div>

        <button type="submit" class="btn submit-btn">Send Message</button>
      </form>
    </div>

    <button class="btn toggle-btn">🌙 Toggle Dark Mode</button>
  </main>

  <footer>
    &copy; 2025 MLBB Items | Made with ❤️
  </footer>

  <script src="script.js"></script>
</body>
</html>
